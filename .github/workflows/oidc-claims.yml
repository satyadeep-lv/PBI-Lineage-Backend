name: Inspect GitHub OIDC Claims

on:
  push:
    branches:
      - chore/aws-cicd-setup

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect-oidc:
    name: Inspect OIDC Claims
    runs-on: ubuntu-latest

    steps:
      - name: Request and inspect OIDC token
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          OIDC_TOKEN="$(
            printf '%s' "${RESPONSE}" |
            python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"

          export OIDC_TOKEN

          python <<'PY'
          import base64
          import json
          import os

          token = os.environ["OIDC_TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          keys = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
          ]

          print("GitHub OIDC claims:")
          print("-------------------")

          for key in keys:
              print(f"{key}={claims.get(key)}")
          PY